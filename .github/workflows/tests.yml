name: FinanceSim tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run quickstart
        run: PYTHONPATH=. python examples/quickstart.py > /dev/null
      - name: Run JSON entrypoint
        run: python -m financesim examples/request.json > /dev/null
      - name: Run scenario and research record interfaces
        run: |
          python -m financesim examples/scenario_request.json > /dev/null
          python -m financesim examples/research_seal_request.json > /dev/null
      - name: Verify initial committed research record
        run: python -c 'import json; from financesim import verify; assert verify(json.load(open("research/daily/2026-10-19.json", encoding="utf-8")))'
      - name: Generate and verify Oct24 weekly forecast record
        run: |
          python research/scripts/generate_2026_10_24.py > /tmp/financesim_weekly.json
          python -c 'import json; from financesim import verify; x=json.load(open("/tmp/financesim_weekly.json")); assert verify(x); assert len(x["payload"]["predictions"]) >= 15; print("FINANCESIM_JSON_START"); print(json.dumps(x,ensure_ascii=False,sort_keys=True)); print("FINANCESIM_JSON_END")'
      - name: Generate post-noon risk-state/50-90 supplement
        run: |
          python research/scripts/generate_2026_10_24_1252_supplement.py > /tmp/financesim_supplement.json
          python -c 'import json; from financesim import verify; x=json.load(open("/tmp/financesim_supplement.json")); assert verify(x); p=x["payload"]; assert len(p["B_market_risk_state"]) == 5; assert len(p["A_C_original_target_interval_50_and_90"]) == 17; print("FINANCESIM_SUPPLEMENT_JSON_START"); print(json.dumps(x,ensure_ascii=False,sort_keys=True)); print("FINANCESIM_SUPPLEMENT_JSON_END")'
      - name: Verify committed addendum exactly matches model replay
        run: |
          python research/scripts/generate_2026_10_24_1252_supplement.py > /tmp/financesim_supplement_replayed.json
          python -c 'import json; from financesim import verify; a=json.load(open("research/weekly/2026-10-24-1252-risk-and-interval-supplement-canonical.json")); b=json.load(open("/tmp/financesim_supplement_replayed.json")); assert verify(a) and a==b; print("Risk/interval supplement replay is byte-equivalent after JSON parse")'
      - name: Replay October31 forecast and confirm the frozen JSON
        run: |
          node research/scripts/generate_2026_10_31.js research/inputs/2026-10-31-1200-snapshot.json > /tmp/financesim_oct31_replay.json
          cmp research/weekly/2026-10-31-forecast.json /tmp/financesim_oct31_replay.json
      - name: Independently replay October31 settlement scoring
        run: python research/scripts/score_2026_10_31.py > /dev/null
      - name: Score November 6 partially published macro first releases
        run: PYTHONPATH=. python research/scripts/score_2026_11_06_partial.py > /dev/null
      - name: Replay November 7 verification (23 real targets)
        run: PYTHONPATH=. python research/scripts/score_2026_11_07.py
      - name: Reproduce frozen November 7 to 13 Monte Carlo forecast
        run: |
          node research/scripts/generate_2026_11_07.js research/inputs/2026-11-07-1200-snapshot.json > /tmp/financesim_nov7_forecast.json
          cmp research/weekly/2026-11-07-forecast.json /tmp/financesim_nov7_forecast.json
      - name: Audit weekly source sensitivity without changing archived scores
        run: python research/scripts/audit_2026_11_07_vendor_sensitivity.py > /dev/null
      - name: Audit November 8 conditional equity-breadth dependence decomposition
        run: node research/scripts/audit_2026_11_08_breadth_dependence.js > /dev/null
      - name: Reproduce November 9 after-Asia market-breadth sensitivity
        run: |
          node research/scripts/audit_2026_11_09_asia_stress.js > /tmp/financesim_nov9_breadth.json
          cmp research/experiments/2026-11-09-asian-closure-shock-sensitivity.json /tmp/financesim_nov9_breadth.json
      - name: Replay November 10 target vintage and midweek horizon audit
        run: |
          node research/scripts/audit_2026_11_10_horizon_and_vintage.js > /tmp/financesim_nov10_audit.json
          cmp research/experiments/2026-11-10-horizon-and-vintage-audit.json /tmp/financesim_nov10_audit.json
      - name: Reproduce November 11 official CPI first-vintage score and Nikkei horizon sensitivity
        run: |
          node research/scripts/audit_2026_11_11_cpi_nikkei.js > /tmp/financesim_nov11_audit.json
          cmp research/experiments/2026-11-11-cpi-nikkei-vintage-and-horizon.json /tmp/financesim_nov11_audit.json
      - name: Replay November 12 BOJ/ONS first-vintage and market issuer snapshot audit
        run: |
          node research/scripts/audit_2026_11_12_vintage_decomposition.js > /tmp/financesim_nov12_vintage.json
          cmp research/experiments/2026-11-12-boj-ons-vintage-decomposition.json /tmp/financesim_nov12_vintage.json
      - name: Replay Nov13 DOL claims first-vintage and official Nikkei close audit
        run: |
          node research/scripts/audit_2026_11_13_claims_asia_close.js > /tmp/financesim_nov13_asof_audit.json
          cmp research/experiments/2026-11-13-claims-nikkei-asof-audit.json /tmp/financesim_nov13_asof_audit.json
      - name: Reproduce Nov14 original three-arm 23-target forecast and append-only corrected risk
        run: |
          node research/scripts/generate_2026_11_14.js research/inputs/2026-11-14-1200-snapshot.json > /tmp/nov14_base.json
          cmp research/weekly/2026-11-14-forecast.json /tmp/nov14_base.json
          node research/scripts/replay_2026_11_14_corrected_b01.js research/inputs/2026-11-14-1200-snapshot.json research/weekly/2026-11-14-forecast.json > /tmp/nov14_corrected.json
          cmp research/weekly/2026-11-14-forecast-corrected-b01.json /tmp/nov14_corrected.json
      - name: Independently replay Nov14 last-week outcome scores, missingness and coverage
        run: |
          node research/scripts/score_2026_11_14_corrected01.js research/weekly/2026-11-07-forecast.json research/inputs/2026-11-14-settlement-sources.json > /tmp/nov14_score.json
          python - <<'PY'
          import json
          got=json.load(open('/tmp/nov14_score.json'))
          expected=json.load(open('research/weekly/2026-11-14-verification-correction01.json'))
          assert got['observed_actuals']==expected['observed_actuals']
          assert got['group_summary']==expected['group_summary']
          assert len(got['missing'])==2
          assert expected['group_summary']['A']['all_conditional']['hybrid']['coverage_50']==0.8
          assert expected['group_summary']['C']['strict_count']==9
          print('Nov14 first-release and market score replay matches append-only artifact')
          PY
