name: FinanceSim tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run quickstart
        run: PYTHONPATH=. python examples/quickstart.py > /dev/null
      - name: Run JSON entrypoint
        run: python -m financesim examples/request.json > /dev/null
      - name: Run scenario and research record interfaces
        run: |
          python -m financesim examples/scenario_request.json > /dev/null
          python -m financesim examples/research_seal_request.json > /dev/null
      - name: Verify initial committed research record
        run: python -c 'import json; from financesim import verify; assert verify(json.load(open("research/daily/2026-10-19.json", encoding="utf-8")))'
      - name: Generate and verify Oct24 weekly forecast record
        run: |
          python research/scripts/generate_2026_10_24.py > /tmp/financesim_weekly.json
          python -c 'import json; from financesim import verify; x=json.load(open("/tmp/financesim_weekly.json")); assert verify(x); assert len(x["payload"]["predictions"]) >= 15; print("FINANCESIM_JSON_START"); print(json.dumps(x,ensure_ascii=False,sort_keys=True)); print("FINANCESIM_JSON_END")'
      - name: Generate post-noon risk-state/50-90 supplement
        run: |
          python research/scripts/generate_2026_10_24_1252_supplement.py > /tmp/financesim_supplement.json
          python -c 'import json; from financesim import verify; x=json.load(open("/tmp/financesim_supplement.json")); assert verify(x); p=x["payload"]; assert len(p["B_market_risk_state"]) == 5; assert len(p["A_C_original_target_interval_50_and_90"]) == 17; print("FINANCESIM_SUPPLEMENT_JSON_START"); print(json.dumps(x,ensure_ascii=False,sort_keys=True)); print("FINANCESIM_SUPPLEMENT_JSON_END")'
      - name: Verify committed addendum exactly matches model replay
        run: |
          python research/scripts/generate_2026_10_24_1252_supplement.py > /tmp/financesim_supplement_replayed.json
          python -c 'import json; from financesim import verify; a=json.load(open("research/weekly/2026-10-24-1252-risk-and-interval-supplement.json")); b=json.load(open("/tmp/financesim_supplement_replayed.json")); assert verify(a) and a==b; print("Risk/interval supplement replay is byte-equivalent after JSON parse")'
