name: FinanceSim tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run quickstart
        run: PYTHONPATH=. python examples/quickstart.py > /dev/null
      - name: Run JSON entrypoint
        run: python -m financesim examples/request.json > /dev/null
      - name: Run scenario and research record interfaces
        run: |
          python -m financesim examples/scenario_request.json > /dev/null
          python -m financesim examples/research_seal_request.json > /dev/null
      - name: Verify initial committed research record
        run: python -c 'import json; from financesim import verify; assert verify(json.load(open("research/daily/2026-10-19.json", encoding="utf-8")))'
      - name: Generate and verify Oct24 weekly forecast record
        run: |
          python research/scripts/generate_2026_10_24.py > /tmp/financesim_weekly.json
          python -c 'import json; from financesim import verify; x=json.load(open("/tmp/financesim_weekly.json")); assert verify(x); assert len(x["payload"]["predictions"]) >= 15; print("FINANCESIM_JSON_START"); print(json.dumps(x,ensure_ascii=False,sort_keys=True)); print("FINANCESIM_JSON_END")'
      - name: Generate post-noon risk-state/50-90 supplement
        run: |
          python research/scripts/generate_2026_10_24_1252_supplement.py > /tmp/financesim_supplement.json
          python -c 'import json; from financesim import verify; x=json.load(open("/tmp/financesim_supplement.json")); assert verify(x); p=x["payload"]; assert len(p["B_market_risk_state"]) == 5; assert len(p["A_C_original_target_interval_50_and_90"]) == 17; print("FINANCESIM_SUPPLEMENT_JSON_START"); print(json.dumps(x,ensure_ascii=False,sort_keys=True)); print("FINANCESIM_SUPPLEMENT_JSON_END")'
      - name: Verify committed addendum exactly matches model replay
        run: |
          python research/scripts/generate_2026_10_24_1252_supplement.py > /tmp/financesim_supplement_replayed.json
          python -c 'import json; from financesim import verify; a=json.load(open("research/weekly/2026-10-24-1252-risk-and-interval-supplement-canonical.json")); b=json.load(open("/tmp/financesim_supplement_replayed.json")); assert verify(a) and a==b; print("Risk/interval supplement replay is byte-equivalent after JSON parse")'
      - name: Replay October31 forecast and confirm the frozen JSON
        run: |
          node research/scripts/generate_2026_10_31.js research/inputs/2026-10-31-1200-snapshot.json > /tmp/financesim_oct31_replay.json
          cmp research/weekly/2026-10-31-forecast.json /tmp/financesim_oct31_replay.json
      - name: Independently replay October31 settlement scoring
        run: python research/scripts/score_2026_10_31.py > /dev/null
      - name: Score November 6 partially published macro first releases
        run: PYTHONPATH=. python research/scripts/score_2026_11_06_partial.py > /dev/null
      - name: Replay November 7 verification (23 real targets)
        run: PYTHONPATH=. python research/scripts/score_2026_11_07.py
      - name: Reproduce frozen November 7 to 13 Monte Carlo forecast
        run: |
          node research/scripts/generate_2026_11_07.js research/inputs/2026-11-07-1200-snapshot.json > /tmp/financesim_nov7_forecast.json
          cmp research/weekly/2026-11-07-forecast.json /tmp/financesim_nov7_forecast.json
      - name: Audit weekly source sensitivity without changing archived scores
        run: python research/scripts/audit_2026_11_07_vendor_sensitivity.py > /dev/null
      - name: Audit November 8 conditional equity-breadth dependence decomposition
        run: node research/scripts/audit_2026_11_08_breadth_dependence.js > /dev/null
      - name: Reproduce November 9 after-Asia market-breadth sensitivity
        run: |
          node research/scripts/audit_2026_11_09_asia_stress.js > /tmp/financesim_nov9_breadth.json
          cmp research/experiments/2026-11-09-asian-closure-shock-sensitivity.json /tmp/financesim_nov9_breadth.json
      - name: Replay November 10 target vintage and midweek horizon audit
        run: |
          node research/scripts/audit_2026_11_10_horizon_and_vintage.js > /tmp/financesim_nov10_audit.json
          cmp research/experiments/2026-11-10-horizon-and-vintage-audit.json /tmp/financesim_nov10_audit.json
      - name: Reproduce November 11 official CPI first-vintage score and Nikkei horizon sensitivity
        run: |
          node research/scripts/audit_2026_11_11_cpi_nikkei.js > /tmp/financesim_nov11_audit.json
          cmp research/experiments/2026-11-11-cpi-nikkei-vintage-and-horizon.json /tmp/financesim_nov11_audit.json
      - name: Replay November 12 BOJ/ONS first-vintage and market issuer snapshot audit
        run: |
          node research/scripts/audit_2026_11_12_vintage_decomposition.js > /tmp/financesim_nov12_vintage.json
          cmp research/experiments/2026-11-12-boj-ons-vintage-decomposition.json /tmp/financesim_nov12_vintage.json
      - name: Replay Nov13 DOL claims first-vintage and official Nikkei close audit
        run: |
          node research/scripts/audit_2026_11_13_claims_asia_close.js > /tmp/financesim_nov13_asof_audit.json
          cmp research/experiments/2026-11-13-claims-nikkei-asof-audit.json /tmp/financesim_nov13_asof_audit.json
      - name: Reproduce Nov14 original three-arm 23-target forecast and append-only corrected risk
        run: |
          node research/scripts/generate_2026_11_14.js research/inputs/2026-11-14-1200-snapshot.json > /tmp/nov14_base.json
          cmp research/weekly/2026-11-14-forecast.json /tmp/nov14_base.json
          node research/scripts/replay_2026_11_14_corrected_b01.js research/inputs/2026-11-14-1200-snapshot.json research/weekly/2026-11-14-forecast.json > /tmp/nov14_corrected.json
          cmp research/weekly/2026-11-14-forecast-corrected-b01.json /tmp/nov14_corrected.json
      - name: Independently replay Nov14 last-week outcome scores, missingness and coverage
        run: |
          node research/scripts/score_2026_11_14_corrected01.js research/weekly/2026-11-07-forecast.json research/inputs/2026-11-14-settlement-sources.json > /tmp/nov14_score.json
          python - <<'PY'
          import json
          got=json.load(open('/tmp/nov14_score.json'))
          expected=json.load(open('research/weekly/2026-11-14-verification-correction01.json'))
          assert got['observed_actuals']==expected['observed_actuals']
          assert got['group_summary']==expected['group_summary']
          assert len(got['missing'])==2
          assert expected['group_summary']['A']['all_conditional']['hybrid']['coverage_50']==0.8
          assert expected['group_summary']['C']['strict_count']==9
          print('Nov14 first-release and market score replay matches append-only artifact')
          PY
      - name: Reproduce cumulative 26-week ledger through Nov14
        run: |
          node research/scripts/cumulative_2026_11_14.js > /tmp/nov14_cumulative.json
          cmp research/experiments/2026-11-14-cumulative-26wk-ledger.json /tmp/nov14_cumulative.json
      - name: Reproduce Nov14 post-noon same-marginals six-equity shadow benchmark
        run: |
          node research/scripts/audit_2026_11_14_breadth_shadow.js > /tmp/nov14_shadow.json
          cmp research/experiments/2026-11-14-breadth-shadow-preoutcome.json /tmp/nov14_shadow.json
      - name: Exact-replay Nov15 32-state Gaussian event-window audit
        run: |
          node research/scripts/audit_2026_11_15_release_exposure.js > /tmp/nov15_event_exposure.json
          cmp research/experiments/2026-11-15-release-exposure-mixture.json /tmp/nov15_event_exposure.json

      - name: Exact replay Nov16 official Asian close and 32-state conditional diagnostic
        run: |
          node research/scripts/audit_2026_11_16_asia_conditional.js > /tmp/financesim_nov16_conditional.json
          python - <<'PY'
          import json
          a=json.load(open('research/experiments/2026-11-16-asia-monday-conditional.json'))
          b=json.load(open('/tmp/financesim_nov16_conditional.json'))
          assert abs(a['observed_monday_return_pct']-b['observed_monday_return_pct'])<1e-12
          assert len(a['scenarios'])==len(b['scenarios'])==4
          for x,y in zip(a['scenarios'],b['scenarios']):
              assert x['future_volatility_multiplier']==y['future_volatility_multiplier']
              assert abs(x['conditional_prob_week_below_minus_1_5_bayes']-y['conditional_prob_week_below_minus_1_5_bayes'])<1e-12
              assert abs(x['conditional_prob_week_positive_bayes']-y['conditional_prob_week_positive_bayes'])<1e-12
          assert a['observed_macro_features']==b['observed_macro_features']
          PY
      - name: Reproduce Nov17 two-session conditional study using Nov14 frozen parameters
        run: |
          PYTHONPATH=. python research/scripts/audit_2026_11_17_two_session_conditional.py > /tmp/nov17_diagnostic.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/nov17_diagnostic.json', encoding='utf-8'))
          report=json.load(open('research/experiments/2026-11-17-two-session-asof-conditional.json', encoding='utf-8'))
          checks=report['output_checkpoint']
          s=result['scenarios']
          got={
              'original_monday_replay_p_week_le_minus1_5':s[1]['monday_only_probability_week_le_minus1_5'],
              'tuesday_sigma1_p_week_le_minus1_5':s[1]['tuesday_probability_week_le_minus1_5'],
              'tuesday_sigma1_no_scenario_reweight_p':s[1]['tuesday_probability_no_reweight'],
              'difference_due_to_latent_state_reweight_percentage_points':s[1]['reweight_difference_pp'],
              'tuesday_sigma1_p_week_positive':s[1]['tuesday_probability_week_positive'],
              'tuesday_sigma1_p_below_frozen_hybrid_90_interval_lower':s[1]['tuesday_probability_below_frozen_hybrid_90_lower'],
              'next_three_days_return_required_for_week_le_minus1_5_boundary_pct':s[1]['needed_return_remaining_three_days_for_week_minus1_5_pct'],
              'tuesday_sigma075_p':s[0]['tuesday_probability_week_le_minus1_5'],
              'tuesday_sigma150_p':s[2]['tuesday_probability_week_le_minus1_5'],
              'tuesday_sigma200_p':s[3]['tuesday_probability_week_le_minus1_5'],
          }
          for k,v in checks.items():
              assert abs(got[k]-v)<1e-7,(k,got[k],v)
          assert result['scenario_state_count']==32 and result['new_monte_carlo_draws']==0
          assert result['frozen_seed']==20261114
          assert result['official_release_exposure_today'][1]['relative_to_nikkei_close']=='after_close'
          assert result['information_as_of']=='2026-11-17T19:16:21+09:00'
          print('Nov17 post-observation model replay matches independently archived numeric checkpoints')
          PY

      - name: Replay Nov18 four realized first-vintage macro targets and issuer close
        run: |
          node research/scripts/score_2026_11_18_four_macro.js > /tmp/nov18_four_macro.json
          cmp research/experiments/2026-11-18-four-macro-first-release-score.json /tmp/nov18_four_macro.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nov18_four_macro.json'))
          assert len(r['actuals'])==4
          assert r['summary']['llm']['mean_brier']==0.164525
          assert r['summary']['statistical']['mae_change_pp']==0.325
          assert r['summary']['hybrid']['mean_brier']==0.197771
          assert r['measured_context_features']['frozen_nov13_to_nov18_pct']==-3.464162
          PY
      - name: Replay Nov19 Japan trade / Nikkei breadth / post-Thursday frozen model diagnostic
        run: |
          node research/scripts/audit_2026_11_19_nikkei_trade_breadth.js > /tmp/nov19_audit.json
          cmp research/experiments/2026-11-19-nikkei-trade-breadth-conditional.json /tmp/nov19_audit.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nov19_audit.json'))
          assert r['scenario_states']==32 and r['frozen_model_seed']==20261114
          assert abs(r['nov17_regression_replay']-0.79211623)<1e-5
          assert r['trade_features']['import_nominal_minus_volume_pp']==21.8
          assert r['breadth_features']['advance_minus_decline_count']==-295
          assert abs(r['breadth_features']['nikkei_day_change_pct']-0.71145298)<1e-7
          assert r['information_as_of']=='2026-11-19T19:20:33+09:00'
          PY

      - name: Reproduce Nov20 DOL/Dallas first-vintage scoring and Nikkei issuer final cash close
        run: |
          node research/scripts/score_2026_11_20_first_vintage_nikkei.js > /tmp/nov20_vintage_score.json
          cmp research/experiments/2026-11-20-first-vintage-six-macro-nikkei.json /tmp/nov20_vintage_score.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nov20_vintage_score.json',encoding='utf-8'))
          assert r['macro_summary']['llm']['mean_direction_brier']==0.1789
          assert r['macro_summary']['hybrid']['mean_direction_brier']==0.205542
          assert r['vintage_disagreement']['wei_direction_flips_if_revised_baseline_used']
          assert r['vintage_disagreement']['claims_change_first_to_first_thousands']==3
          assert abs(r['nikkei_realized']['weekly_return_pct']+7.696302)<1e-8
          assert not r['nikkei_realized']['arms']['hybrid']['coverage_90']
          assert r['nikkei_realized']['arms']['llm']['coverage_90']
          assert r['new_monte_carlo_draws']==0
          PY
      - name: Replay November 21 matched as-of macro, market and joint-tail verification
        run: node research/scripts/score_2026_11_21.js
      - name: Reproduce November 21 three-arm 26-target 20000-draw forecast
        run: |
          node research/scripts/generate_2026_11_21.js research/inputs/2026-11-21-1200-snapshot.json > /tmp/nov21_forecast_replayed.json
          cmp research/weekly/2026-11-21-forecast.json /tmp/nov21_forecast_replayed.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nov21_forecast_replayed.json'))
          assert len(r['macro_forecasts'])==9 and len(r['risk_forecasts'])==5 and len(r['market_forecasts'])==12
          assert r['seed']==20261121 and r['draws']==20000
          for group in ('macro_forecasts','risk_forecasts','market_forecasts'):
              assert all(set(z['arms'])=={'llm','statistical','hybrid'} for z in r[group].values())
          PY
