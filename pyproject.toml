[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "financesim-research"
version = "0.1.0"
description = "Unified walk-forward economic and financial forecasting experiment"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["financesim*"]
